<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多機能VOCA（写真・イラスト変更対応版）</title>
  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
    }

    .screen { display: none; width: 100vw; height: 100vh; }
    .screen.active { display: flex; }

    /* ------------------------------
       1. 設定画面
    ------------------------------ */
    #setup-screen {
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
      background-color: #121212;
      color: #ffffff;
    }
    .setup-card {
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
    }
    h1, h2 { margin-top: 0; color: #ffffff; }
    .option-count-selector { display: flex; gap: 15px; margin-bottom: 10px; }
    .option-count-selector label { font-size: 1.2rem; font-weight: bold; cursor: pointer; }
    
    .preset-btns { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .preset-btn {
      background: #333; color: #fff; border: 1px solid #666;
      padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold;
    }
    .preset-btn:hover { background: #0d6efd; border-color: #0d6efd; }

    .item-config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
    }
    .item-config-box {
      border: 2px solid #555;
      border-radius: 8px;
      padding: 15px;
      background: #2a2a2a;
    }
    .item-config-box label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.95rem; color: #00ffcc; }
    .item-config-box input[type="text"] {
      width: 100%; padding: 10px; margin-top: 6px;
      background: #333; color: #fff; border: 1px solid #666; border-radius: 6px; font-size: 1rem;
    }
    .file-input-wrapper {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-input-btn {
      background: #444; color: #fff; border: 1px solid #777;
      padding: 8px 12px; border-radius: 6px; cursor: pointer; text-align: center;
      font-size: 0.9rem; font-weight: bold;
    }
    .preview-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      background: #1a1a1a;
      padding: 8px;
      border-radius: 6px;
    }
    .preview-thumb {
      width: 70px; height: 70px; object-fit: contain;
      border: 1px solid #666; background: #000; border-radius: 6px;
    }
    .start-btn {
      background-color: #0d6efd; color: white;
      font-size: 1.5rem; font-weight: bold;
      padding: 15px 40px; border: none; border-radius: 30px;
      cursor: pointer; margin-bottom: 30px;
      box-shadow: 0 4px 10px rgba(13,110,253,0.5);
    }

    /* ------------------------------
       2. 操作画面
    ------------------------------ */
    #play-screen {
      flex-direction: column;
      position: relative;
      background-color: #000000;
    }

    .back-btn {
      position: absolute; top: 15px; right: 15px; z-index: 100;
      background: rgba(255,255,255,0.2); color: white;
      border: 1px solid #ffffff; padding: 8px 16px; border-radius: 20px;
      cursor: pointer;
    }

    #cam-preview-container {
      position: absolute; top: 15px; left: 15px; z-index: 100;
      border: 2px solid #555; border-radius: 8px; overflow: hidden;
      width: 120px; height: 90px; background: #222;
    }
    #webcam { width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }

    #face-status {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      color: #00ffcc; font-size: 1.1rem; font-weight: bold; z-index: 100;
      background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 20px;
      border: 1px solid #333;
    }

    .play-container {
      flex: 1; display: grid; width: 100%; height: 100%;
      padding: 60px; gap: 40px; align-items: center; justify-items: center;
    }
    .play-container.mode-2 { grid-template-columns: 1fr 1fr; }
    .play-container.mode-3 { grid-template-columns: 1fr 1fr 1fr; }
    .play-container.mode-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    /* SVGによるアラウンド枠線アニメーション */
    .card-wrapper {
      position: relative;
      width: 60%;
      height: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%; height: 100%;
      background: #111111;
      border-radius: 24px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: transform 0.2s;
      cursor: pointer;
      position: relative;
      z-index: 1;
    }

    .border-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .border-bg {
      fill: none;
      stroke: #ffffff;
      stroke-width: 6;
      rx: 24px; ry: 24px;
    }
    .border-progress {
      fill: none;
      stroke: #00ffcc;
      stroke-width: 8;
      rx: 24px; ry: 24px;
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      transition: stroke-dashoffset 0s linear;
    }

    /* 2秒間の枠周回アニメーション */
    .card-wrapper.focusing .border-progress {
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 2s linear;
    }
    .card-wrapper.focusing .card {
      transform: scale(1.03);
    }

    .card img { max-width: 65%; max-height: 50%; object-fit: contain; margin-bottom: 10px; }
    .card .label { font-size: 2rem; font-weight: bold; color: #ffffff; text-align: center; }
  </style>
</head>
<body>

  <!-- ==================== 1. 初期設定画面 ==================== -->
  <div id="setup-screen" class="screen active">
    <h1>多機能VOCA 設定画面</h1>

    <div class="setup-card">
      <h2>1. 選択肢の数</h2>
      <div class="option-count-selector">
        <label><input type="radio" name="count" value="2" checked onchange="changeCount(2)"> 2択</label>
        <label><input type="radio" name="count" value="3" onchange="changeCount(3)"> 3択</label>
        <label><input type="radio" name="count" value="4" onchange="changeCount(4)"> 4択</label>
      </div>

      <h2>2. サンプルプリセットの選択</h2>
      <div class="preset-btns">
        <button class="preset-btn" onclick="applyPreset('fruit')">🍎 果物セット</button>
        <button class="preset-btn" onclick="applyPreset('color')">🎨 色セット</button>
        <button class="preset-btn" onclick="applyPreset('animal')">🐶 動物セット</button>
      </div>
    </div>

    <div class="setup-card">
      <h2>3. 各枠の文字・写真・イラスト設定</h2>
      <div class="item-config-grid" id="config-grid"></div>
    </div>

    <button class="start-btn" onclick="startApp()">カメラを開始してスタート</button>
  </div>

  <!-- ==================== 2. 操作画面 ==================== -->
  <div id="play-screen" class="screen">
    <div id="cam-preview-container">
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div id="face-status">顔・目・口の動作を検出中...</div>
    <button class="back-btn" onclick="showSetup()">⚙ 設定に戻る</button>
    <div class="play-container" id="play-container"></div>
  </div>

  <script>
    let currentCount = 2;
    const DWELL_TIME_MS = 2000; // 2秒

    const presets = {
      fruit: [
        { text: 'りんご', img: 'https://via.placeholder.com/200/ff4d4d/FFFFFF?text=りんご' },
        { text: 'みかん', img: 'https://via.placeholder.com/200/ffa500/FFFFFF?text=みかん' },
        { text: 'ぶどう', img: 'https://via.placeholder.com/200/8a2be2/FFFFFF?text=ぶどう' },
        { text: 'バナナ', img: 'https://via.placeholder.com/200/ffd700/FFFFFF?text=バナナ' }
      ],
      color: [
        { text: 'あか', img: 'https://via.placeholder.com/200/ff0000/FFFFFF?text=赤' },
        { text: 'あお', img: 'https://via.placeholder.com/200/0000ff/FFFFFF?text=青' },
        { text: 'きいろ', img: 'https://via.placeholder.com/200/ffff00/000000?text=黄' },
        { text: 'みどり', img: 'https://via.placeholder.com/200/008000/FFFFFF?text=緑' }
      ],
      animal: [
        { text: 'いぬ', img: 'https://via.placeholder.com/200/d2691e/FFFFFF?text=いぬ' },
        { text: 'ねこ', img: 'https://via.placeholder.com/200/708090/FFFFFF?text=ねこ' },
        { text: 'うさぎ', img: 'https://via.placeholder.com/200/ffb6c1/000000?text=うさぎ' },
        { text: 'くま', img: 'https://via.placeholder.com/200/8b4513/FFFFFF?text=くま' }
      ]
    };

    let items = [...presets.fruit];

    let camera = null;
    let faceMesh = null;
    let activeTargetIndex = -1;
    let dwellTimer = null;
    let isSelected = false;

    function applyPreset(type) {
      items = JSON.parse(JSON.stringify(presets[type]));
      renderSetupForm();
    }

    function loadSavedData() {
      const savedCount = localStorage.getItem('voca_count');
      const savedItems = localStorage.getItem('voca_items');
      if (savedCount) {
        currentCount = parseInt(savedCount, 10);
        const radio = document.querySelector(`input[name="count"][value="${currentCount}"]`);
        if (radio) radio.checked = true;
      }
      if (savedItems) items = JSON.parse(savedItems);
    }

    // 設定画面の描画（ファイル選択・写真設定機能）
    function renderSetupForm() {
      const grid = document.getElementById('config-grid');
      grid.innerHTML = '';
      for (let i = 0; i < currentCount; i++) {
        const box = document.createElement('div');
        box.className = 'item-config-box';
        box.innerHTML = `
          <h3>枠 ${i + 1}</h3>
          <label>表示・読み上げテキスト:</label>
          <input type="text" value="${items[i].text}" onchange="items[${i}].text=this.value">
          
          <label>写真・イラストの指定:</label>
          <div class="file-input-wrapper">
            <input type="file" id="file-input-${i}" accept="image/*" style="display:none;" onchange="updateImage(${i}, this)">
            <button type="button" class="file-input-btn" onclick="document.getElementById('file-input-${i}').click()">
              📷 端末から写真・画像を選択
            </button>
          </div>

          <div class="preview-container">
            <img src="${items[i].img}" id="preview-${i}" class="preview-thumb">
            <span style="font-size:0.85rem; color:#aaa;">プレビュー表示</span>
          </div>
        `;
        grid.appendChild(box);
      }
    }

    function changeCount(count) {
      currentCount = count;
      renderSetupForm();
    }

    // ユーザーが端末から写真/イラストを選択したときの処理
    function updateImage(index, input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          items[index].img = e.target.result;
          document.getElementById(`preview-${index}`).src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function startApp() {
      localStorage.setItem('voca_count', currentCount);
      localStorage.setItem('voca_items', JSON.stringify(items));

      document.getElementById('setup-screen').classList.remove('active');
      document.getElementById('play-screen').classList.add('active');

      const container = document.getElementById('play-container');
      container.innerHTML = '';
      container.className = `play-container mode-${currentCount}`;

      for (let i = 0; i < currentCount; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.id = `wrapper-${i}`;

        wrapper.innerHTML = `
          <svg class="border-svg">
            <rect class="border-bg" width="100%" height="100%"/>
            <rect class="border-progress" id="progress-${i}" width="100%" height="100%"/>
          </svg>
          <div class="card" onclick="triggerSelect(${i})">
            <img src="${items[i].img}">
            <div class="label">${items[i].text}</div>
          </div>
        `;
        container.appendChild(wrapper);

        setTimeout(() => {
          const rect = document.getElementById(`progress-${i}`);
          if (rect) {
            const length = rect.getTotalLength ? rect.getTotalLength() : 2000;
            rect.style.strokeDasharray = length;
            rect.style.strokeDashoffset = length;
          }
        }, 100);
      }

      initCamera();
    }

    function showSetup() {
      if (camera) camera.stop();
      document.getElementById('play-screen').classList.remove('active');
      document.getElementById('setup-screen').classList.add('active');
    }

    function initCamera() {
      const videoElement = document.getElementById('webcam');

      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onFaceResults);

      camera = new Camera(videoElement, {
        onFrame: async () => { await faceMesh.send({ image: videoElement }); },
        width: 320,
        height: 240
      });
      camera.start();
    }

    function onFaceResults(results) {
      const statusEl = document.getElementById('face-status');
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        statusEl.innerText = "検出されていません";
        resetFocus();
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];
      const nose = landmarks[1];          // 鼻
      const leftIris = landmarks[468];    // 左目黒目
      const rightIris = landmarks[473];   // 右目黒目

      // 口閉じ判定
      const upperLip = landmarks[13];
      const lowerLip = landmarks[14];
      const mouthDistance = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y);
      const isMouthClosed = mouthDistance < 0.018;

      const avgX = (nose.x + leftIris.x + rightIris.x) / 3;
      const avgY = (nose.y + leftIris.y + rightIris.y) / 3;

      let targetIdx = -1;

      if (isMouthClosed) {
        if (avgX > 0.52) targetIdx = 0;
        else if (avgX < 0.48) targetIdx = (currentCount > 1) ? 1 : 0;
      }

      if (targetIdx === -1) {
        if (currentCount === 2) {
          if (avgX > 0.55) targetIdx = 0;
          else if (avgX < 0.45) targetIdx = 1;
        } else if (currentCount === 3) {
          if (avgX > 0.58) targetIdx = 0;
          else if (avgX < 0.42) targetIdx = 2;
          else if (avgX >= 0.42 && avgX <= 0.58) targetIdx = 1;
        } else if (currentCount === 4) {
          const isRight = avgX < 0.5;
          const isBottom = avgY > 0.5;
          if (!isRight && !isBottom) targetIdx = 0;
          if (isRight && !isBottom) targetIdx = 1;
          if (!isRight && isBottom) targetIdx = 2;
          if (isRight && isBottom) targetIdx = 3;
        }
      }

      if (targetIdx !== -1) {
        const actionText = isMouthClosed ? "（口閉じ検出）" : "";
        statusEl.innerText = `「${items[targetIdx].text}」を選択中 ${actionText}`;
        handleFocus(targetIdx);
      } else {
        statusEl.innerText = "正面を向いています";
        resetFocus();
      }
    }

    function handleFocus(index) {
      if (isSelected) return;

      if (activeTargetIndex !== index) {
        resetFocus();
        activeTargetIndex = index;
        const wrapper = document.getElementById(`wrapper-${index}`);
        if (wrapper) {
          wrapper.classList.add('focusing');
        }

        dwellTimer = setTimeout(() => {
          triggerSelect(index);
        }, DWELL_TIME_MS);
      }
    }

    function triggerSelect(index) {
      speak(items[index].text);
      isSelected = true;
      resetFocus();
    }

    function resetFocus() {
      if (activeTargetIndex !== -1) {
        const wrapper = document.getElementById(`wrapper-${activeTargetIndex}`);
        if (wrapper) {
          wrapper.classList.remove('focusing');
        }
      }
      activeTargetIndex = -1;
      isSelected = false;
      clearTimeout(dwellTimer);
    }

    function speak(text) {
      if (!text) return;
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = "ja-JP";
      speechSynthesis.speak(uttr);
    }

    loadSavedData();
    renderSetupForm();
  </script>

</body>
</html>
