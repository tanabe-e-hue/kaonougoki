<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>項目モード VOCA（自動スキャン＆イラスト選べる版）</title>
  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
    }

    .screen { display: none; width: 100vw; height: 100vh; }
    .screen.active { display: flex; }

    /* ------------------------------
       1. 設定画面
    ------------------------------ */
    #setup-screen {
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
      background-color: #121212;
      color: #ffffff;
    }
    .setup-card {
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 850px;
      margin-bottom: 20px;
    }
    h1, h2 { margin-top: 0; color: #ffffff; }
    .option-count-selector { display: flex; gap: 15px; margin-bottom: 10px; }
    .option-count-selector label { font-size: 1.2rem; font-weight: bold; cursor: pointer; }

    .item-config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
    }
    .item-config-box {
      border: 2px solid #555;
      border-radius: 8px;
      padding: 15px;
      background: #2a2a2a;
    }
    .item-config-box label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.95rem; color: #00ffcc; }
    .item-config-box input[type="text"], .item-config-box select {
      width: 100%; padding: 10px; margin-top: 6px;
      background: #333; color: #fff; border: 1px solid #666; border-radius: 6px; font-size: 1rem;
    }

    .preview-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      background: #1a1a1a;
      padding: 8px;
      border-radius: 6px;
    }
    .preview-thumb {
      width: 60px; height: 60px; object-fit: contain;
      border: 1px solid #666; background: #000; border-radius: 6px;
    }

    .start-btn {
      background-color: #0d6efd; color: white;
      font-size: 1.5rem; font-weight: bold;
      padding: 15px 40px; border: none; border-radius: 30px;
      cursor: pointer; margin-bottom: 30px;
      box-shadow: 0 4px 10px rgba(13,110,253,0.5);
    }

    /* ------------------------------
       2. アナウンス画面 (スタート時)
    ------------------------------ */
    #announce-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.92);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000;
    }
    #announce-overlay.active { display: flex; }
    #announce-text {
      font-size: 4rem; font-weight: bold; color: #00ffcc;
      text-shadow: 0 0 20px rgba(0,255,204,0.6);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { transform: scale(0.95); } to { transform: scale(1.05); } }

    /* ------------------------------
       3. 操作画面（項目モード）
    ------------------------------ */
    #play-screen {
      flex-direction: column;
      position: relative;
      background-color: #000000;
    }

    .back-btn {
      position: absolute; top: 15px; right: 15px; z-index: 100;
      background: rgba(255,255,255,0.2); color: white;
      border: 1px solid #ffffff; padding: 8px 16px; border-radius: 20px;
      cursor: pointer;
    }

    #cam-preview-container {
      position: absolute; top: 15px; left: 15px; z-index: 100;
      border: 2px solid #555; border-radius: 8px; overflow: hidden;
      width: 120px; height: 90px; background: #222;
    }
    #webcam { width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }

    #face-status {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      color: #00ffcc; font-size: 1.1rem; font-weight: bold; z-index: 100;
      background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 20px;
      border: 1px solid #333;
    }

    .play-container {
      flex: 1; display: grid; width: 100%; height: 100%;
      padding: 60px; gap: 30px; align-items: center; justify-items: center;
    }
    .play-container.mode-2 { grid-template-columns: 1fr 1fr; }
    .play-container.mode-3 { grid-template-columns: 1fr 1fr 1fr; }
    .play-container.mode-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .card-wrapper {
      position: relative;
      width: 70%;
      height: 60%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%; height: 100%;
      background: #111111;
      border-radius: 24px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: transform 0.2s;
      cursor: pointer;
      position: relative;
      z-index: 1;
      padding: 15px;
    }

    .border-svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
    }
    .border-bg {
      fill: none; stroke: #ffffff; stroke-width: 6; rx: 24px; ry: 24px;
    }
    .border-progress {
      fill: none; stroke: #00ffcc; stroke-width: 8; rx: 24px; ry: 24px;
      stroke-dasharray: 2000; stroke-dashoffset: 2000;
      transition: stroke-dashoffset 0s linear;
    }

    /* 2秒間の緑枠線周回アニメーション */
    .card-wrapper.focusing .border-progress {
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 2s linear;
    }
    .card-wrapper.focusing .card { transform: scale(1.05); }

    .card img { max-width: 65%; max-height: 55%; object-fit: contain; margin-bottom: 15px; }
    .card .label { font-size: 2.2rem; font-weight: bold; color: #ffffff; text-align: center; }
  </style>
</head>
<body>

  <!-- ==================== 1. 初期設定画面 ==================== -->
  <div id="setup-screen" class="screen active">
    <h1>項目選択モード VOCA 設定</h1>

    <div class="setup-card">
      <h2>1. 枠の数（選択肢数）</h2>
      <div class="option-count-selector">
        <label><input type="radio" name="count" value="2" checked onchange="changeCount(2)"> 2項目</label>
        <label><input type="radio" name="count" value="3" onchange="changeCount(3)"> 3項目</label>
        <label><input type="radio" name="count" value="4" onchange="changeCount(4)"> 4項目</label>
      </div>
    </div>

    <div class="setup-card">
      <h2>2. 各枠のイラスト・文字割り当て（各5種・全15種から選択）</h2>
      <div class="item-config-grid" id="config-grid"></div>
    </div>

    <button class="start-btn" onclick="startAppWithAnnounce()">スタート</button>
  </div>

  <!-- アナウンス用オーバーレイ -->
  <div id="announce-overlay">
    <div id="announce-text">はじめます</div>
  </div>

  <!-- ==================== 2. 操作画面 ==================== -->
  <div id="play-screen" class="screen">
    <div id="cam-preview-container">
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div id="face-status">顔・口の動きを検出中...</div>
    <button class="back-btn" onclick="showSetup()">⚙ 設定に戻る</button>
    <div class="play-container" id="play-container"></div>
  </div>

  <script>
    // 5個ずつのイラストデータライブラリ（計15個）
    const illustrationLibrary = [
      // くだもの（5個）
      { id: 'f1', category: 'くだもの', name: 'りんご', img: 'https://via.placeholder.com/250/ff4d4d/FFFFFF?text=🍎+りんご' },
      { id: 'f2', category: 'くだもの', name: 'みかん', img: 'https://via.placeholder.com/250/ffa500/FFFFFF?text=🍊+みかん' },
      { id: 'f3', category: 'くだもの', name: 'ぶどう', img: 'https://via.placeholder.com/250/8a2be2/FFFFFF?text=🍇+ぶどう' },
      { id: 'f4', category: 'くだもの', name: 'バナナ', img: 'https://via.placeholder.com/250/ffd700/000000?text=🍌+バナナ' },
      { id: 'f5', category: 'くだもの', name: 'いちご', img: 'https://via.placeholder.com/250/ff1493/FFFFFF?text=🍓+いちご' },
      
      // 色（5個）
      { id: 'c1', category: '色', name: 'あか', img: 'https://via.placeholder.com/250/ff0000/FFFFFF?text=🔴+あか' },
      { id: 'c2', category: '色', name: 'あお', img: 'https://via.placeholder.com/250/0000ff/FFFFFF?text=🔵+あお' },
      { id: 'c3', category: '色', name: 'きいろ', img: 'https://via.placeholder.com/250/ffff00/000000?text=🟡+きいろ' },
      { id: 'c4', category: '色', name: 'みどり', img: 'https://via.placeholder.com/250/008000/FFFFFF?text=🟢+みどり' },
      { id: 'c5', category: '色', name: 'くろ', img: 'https://via.placeholder.com/250/333333/FFFFFF?text=⚫+くろ' },

      // 動物（5個）
      { id: 'a1', category: '動物', name: 'いぬ', img: 'https://via.placeholder.com/250/d2691e/FFFFFF?text=🐶+いぬ' },
      { id: 'a2', category: '動物', name: 'ねこ', img: 'https://via.placeholder.com/250/708090/FFFFFF?text=🐱+ねこ' },
      { id: 'a3', category: '動物', name: 'うさぎ', img: 'https://via.placeholder.com/250/ffb6c1/000000?text=🐰+うさぎ' },
      { id: 'a4', category: '動物', name: 'くま', img: 'https://via.placeholder.com/250/8b4513/FFFFFF?text=🐻+くま' },
      { id: 'a5', category: '動物', name: 'ぞう', img: 'https://via.placeholder.com/250/4682b4/FFFFFF?text=🐘+ぞう' }
    ];

    let currentCount = 2;
    let selectedItems = [illustrationLibrary[0], illustrationLibrary[5]]; // 初期化（りんご, あか）

    const DWELL_TIME_MS = 2000; // 2秒注視
    const SCAN_INTERVAL_MS = 5000; // 5秒で自動移動

    let camera = null;
    let faceMesh = null;
    let activeTargetIndex = -1;
    let dwellTimer = null;
    let scanIntervalTimer = null;
    let isSelected = false;
    let autoScanIndex = 0;

    function renderSetupForm() {
      const grid = document.getElementById('config-grid');
      grid.innerHTML = '';

      for (let i = 0; i < currentCount; i++) {
        if (!selectedItems[i]) selectedItems[i] = illustrationLibrary[i % illustrationLibrary.length];
        
        const box = document.createElement('div');
        box.className = 'item-config-box';
        
        let selectOptionsHtml = '';
        illustrationLibrary.forEach((item, index) => {
          const isSel = (item.id === selectedItems[i].id) ? 'selected' : '';
          selectOptionsHtml += `<option value="${index}" ${isSel}>[${item.category}] ${item.name}</option>`;
        });

        box.innerHTML = `
          <h3>枠 ${i + 1}</h3>
          <label>イラスト・項目を選択:</label>
          <select onchange="onSelectItem(${i}, this.value)">
            ${selectOptionsHtml}
          </select>

          <label>表示テキスト (変更可):</label>
          <input type="text" id="label-input-${i}" value="${selectedItems[i].name}" onchange="selectedItems[${i}].name=this.value">

          <div class="preview-container">
            <img src="${selectedItems[i].img}" id="preview-${i}" class="preview-thumb">
            <span style="font-size:0.85rem; color:#aaa;">プレビュー</span>
          </div>
        `;
        grid.appendChild(box);
      }
    }

    function onSelectItem(slotIndex, libIndex) {
      const chosen = illustrationLibrary[libIndex];
      selectedItems[slotIndex] = { ...chosen };
      document.getElementById(`preview-${slotIndex}`).src = chosen.img;
      document.getElementById(`label-input-${slotIndex}`).value = chosen.name;
    }

    function changeCount(count) {
      currentCount = count;
      renderSetupForm();
    }

    // スタート時に「はじめます」のアナウンス＋表示
    function startAppWithAnnounce() {
      document.getElementById('setup-screen').classList.remove('active');
      const overlay = document.getElementById('announce-overlay');
      overlay.classList.add('active');

      speak("はじめます");

      setTimeout(() => {
        overlay.classList.remove('active');
        startPlayScreen();
      }, 2000);
    }

    function startPlayScreen() {
      document.getElementById('play-screen').classList.add('active');

      const container = document.getElementById('play-container');
      container.innerHTML = '';
      container.className = `play-container mode-${currentCount}`;

      for (let i = 0; i < currentCount; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.id = `wrapper-${i}`;

        wrapper.innerHTML = `
          <svg class="border-svg">
            <rect class="border-bg" width="100%" height="100%"/>
            <rect class="border-progress" id="progress-${i}" width="100%" height="100%"/>
          </svg>
          <div class="card" onclick="triggerSelect(${i})">
            <img src="${selectedItems[i].img}">
            <div class="label">${selectedItems[i].name}</div>
          </div>
        `;
        container.appendChild(wrapper);

        setTimeout(() => {
          const rect = document.getElementById(`progress-${i}`);
          if (rect) {
            const length = rect.getTotalLength ? rect.getTotalLength() : 2000;
            rect.style.strokeDasharray = length;
            rect.style.strokeDashoffset = length;
          }
        }, 100);
      }

      initCamera();
      startAutoScan();
    }

    // 左から順番に5秒ずつフォーカスを移動（自動スキャン）
    function startAutoScan() {
      stopAutoScan();
      autoScanIndex = 0;
      handleFocus(autoScanIndex);

      scanIntervalTimer = setInterval(() => {
        autoScanIndex = (autoScanIndex + 1) % currentCount;
        handleFocus(autoScanIndex);
      }, SCAN_INTERVAL_MS);
    }

    function stopAutoScan() {
      if (scanIntervalTimer) clearInterval(scanIntervalTimer);
    }

    function showSetup() {
      if (camera) camera.stop();
      stopAutoScan();
      document.getElementById('play-screen').classList.remove('active');
      document.getElementById('setup-screen').classList.add('active');
    }

    function initCamera() {
      const videoElement = document.getElementById('webcam');

      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onFaceResults);

      camera = new Camera(videoElement, {
        onFrame: async () => { await faceMesh.send({ image: videoElement }); },
        width: 320,
        height: 240
      });
      camera.start();
    }

    function onFaceResults(results) {
      const statusEl = document.getElementById('face-status');
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        statusEl.innerText = "自動スキャン進行中...";
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];
      const nose = landmarks[1];
      const leftIris = landmarks[468];
      const rightIris = landmarks[473];

      // 口を閉じる判定
      const upperLip = landmarks[13];
      const lowerLip = landmarks[14];
      const mouthDistance = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y);
      const isMouthClosed = mouthDistance < 0.018;

      const avgX = (nose.x + leftIris.x + rightIris.x) / 3;

      let detectedIdx = -1;

      // 顔の向きによる目標検知
      if (currentCount === 2) {
        if (avgX > 0.55) detectedIdx = 0;
        else if (avgX < 0.45) detectedIdx = 1;
      } else if (currentCount === 3) {
        if (avgX > 0.58) detectedIdx = 0;
        else if (avgX < 0.42) detectedIdx = 2;
        else if (avgX >= 0.42 && avgX <= 0.58) detectedIdx = 1;
      } else if (currentCount === 4) {
        if (avgX > 0.55) detectedIdx = 0;
        else if (avgX < 0.45) detectedIdx = 1;
      }

      // 口を閉じた場合は現在フォーカスされている項目を選択確定
      if (isMouthClosed && activeTargetIndex !== -1) {
        statusEl.innerText = "口閉じ検出：選択確定";
        triggerSelect(activeTargetIndex);
        return;
      }

      // 顔の向きで検知された場合はフォーカス切り替え
      if (detectedIdx !== -1 && detectedIdx !== activeTargetIndex) {
        statusEl.innerText = `「${selectedItems[detectedIdx].name}」に顔が向いています`;
        handleFocus(detectedIdx);
      }
    }

    function handleFocus(index) {
      if (isSelected) return;

      if (activeTargetIndex !== index) {
        resetFocusEffect();
        activeTargetIndex = index;
        const wrapper = document.getElementById(`wrapper-${index}`);
        if (wrapper) {
          wrapper.classList.add('focusing');
        }

        // 2秒間見ることで選択確定
        dwellTimer = setTimeout(() => {
          triggerSelect(index);
        }, DWELL_TIME_MS);
      }
    }

    function triggerSelect(index) {
      speak(selectedItems[index].name);
      isSelected = true;
      resetFocusEffect();

      // 2秒後に選択復帰
      setTimeout(() => {
        isSelected = false;
      }, 2000);
    }

    function resetFocusEffect() {
      if (activeTargetIndex !== -1) {
        const wrapper = document.getElementById(`wrapper-${activeTargetIndex}`);
        if (wrapper) {
          wrapper.classList.remove('focusing');
        }
      }
      clearTimeout(dwellTimer);
      activeTargetIndex = -1;
    }

    function speak(text) {
      if (!text) return;
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = "ja-JP";
      speechSynthesis.speak(uttr);
    }

    renderSetupForm();
  </script>

</body>
</html>
